---
- name: Install prerequisite packages
  apt:
    name:
      - apt-transport-https
      - ca-certificates
      - gnupg
      - curl
      - unzip
    state: present
    update_cache: yes
- name: Add Elastic GPG signing key
  apt_key:
    url: https://artifacts.elastic.co/GPG-KEY-elasticsearch
    state: present
- name: Add Elastic APT repository
  apt_repository:
    repo: "deb https://artifacts.elastic.co/packages/{{ elastic_major_version }}/apt stable main"
    state: present
    filename: elastic
- name: Install Elasticsearch
  apt:
    name: elasticsearch
    state: present
    update_cache: yes
- name: Ensure certs directory exists
  file:
    path: /etc/elasticsearch/certs
    state: directory
    owner: root
    group: elasticsearch
    mode: '0750'

- name: Generate CA certificate (only on first node)
  command: /usr/share/elasticsearch/bin/elasticsearch-certutil ca --silent --pem --out /tmp/elastic-stack-ca.zip
  args:
    creates: /tmp/elastic-stack-ca.zip
  run_once: true
  delegate_to: "{{ groups['role_elk'][0] }}"

- name: Unzip CA certificate (only on first node)
  unarchive:
    src: /tmp/elastic-stack-ca.zip
    dest: /tmp
    remote_src: yes
    creates: /tmp/ca/ca.crt
  run_once: true
  delegate_to: "{{ groups['role_elk'][0] }}"

- name: Generate node certificate signed by CA (only on first node)
  command: /usr/share/elasticsearch/bin/elasticsearch-certutil cert --silent --pem --ca-cert /tmp/ca/ca.crt --ca-key /tmp/ca/ca.key --out /tmp/elastic-certs.zip --name elastic-node
  args:
    creates: /tmp/elastic-certs.zip
  run_once: true
  delegate_to: "{{ groups['role_elk'][0] }}"

- name: Unzip node certificate (only on first node)
  unarchive:
    src: /tmp/elastic-certs.zip
    dest: /tmp
    remote_src: yes
    creates: /tmp/elastic-node/elastic-node.crt
  run_once: true
  delegate_to: "{{ groups['role_elk'][0] }}"

- name: Fetch CA cert to controller
  fetch:
    src: /tmp/ca/ca.crt
    dest: /tmp/elk-certs/ca.crt
    flat: yes
  run_once: true
  delegate_to: "{{ groups['role_elk'][0] }}"

- name: Fetch node cert to controller
  fetch:
    src: /tmp/elastic-node/elastic-node.crt
    dest: /tmp/elk-certs/elastic-node.crt
    flat: yes
  run_once: true
  delegate_to: "{{ groups['role_elk'][0] }}"

- name: Fetch node key to controller
  fetch:
    src: /tmp/elastic-node/elastic-node.key
    dest: /tmp/elk-certs/elastic-node.key
    flat: yes
  run_once: true
  delegate_to: "{{ groups['role_elk'][0] }}"

- name: Copy CA cert to all nodes
  copy:
    src: /tmp/elk-certs/ca.crt
    dest: /etc/elasticsearch/certs/ca.crt
    owner: root
    group: elasticsearch
    mode: '0640'

- name: Copy node cert to all nodes
  copy:
    src: /tmp/elk-certs/elastic-node.crt
    dest: /etc/elasticsearch/certs/elastic-node.crt
    owner: root
    group: elasticsearch
    mode: '0640'

- name: Copy node key to all nodes
  copy:
    src: /tmp/elk-certs/elastic-node.key
    dest: /etc/elasticsearch/certs/elastic-node.key
    owner: root
    group: elasticsearch
    mode: '0640'

- name: Copy Elasticsearch configuration file
  template:
    src: elasticsearch.yml.j2
    dest: /etc/elasticsearch/elasticsearch.yml
    owner: root
    group: elasticsearch
    mode: '0660'
  notify: Restart Elasticsearch

- name: Check existing users in file realm
  command: "/usr/share/elasticsearch/bin/elasticsearch-users list"
  register: es_users_list
  changed_when: false
  failed_when: false

- name: Create admin superuser in file realm
  command: "/usr/share/elasticsearch/bin/elasticsearch-users useradd {{ elastic_admin_user }} -p {{ elastic_admin_password }} -r superuser"
  when: elastic_admin_user not in es_users_list.stdout

- name: Create anonymous viewer user in file realm
  command: "/usr/share/elasticsearch/bin/elasticsearch-users useradd {{ elastic_anonymous_user }} -p {{ elastic_anonymous_password }} -r kibana_user,viewer"
  when: elastic_anonymous_user not in es_users_list.stdout

- name: Ensure correct permissions on file realm credentials
  file:
    path: "{{ item }}"
    owner: root
    group: elasticsearch
    mode: '0660'
    state: file
  loop:
    - /etc/elasticsearch/users
    - /etc/elasticsearch/users_roles
  failed_when: false

- name: Enable and start Elasticsearch service
  systemd:
    name: elasticsearch
    state: started
    enabled: yes


- name: Wait for Elasticsearch to start listening on port 9200
  wait_for:
    host: 127.0.0.1
    port: 9200
    delay: 5
    timeout: 60
    state: started


- name: Set password for kibana_system built-in user
  uri:
    url: "http://127.0.0.1:{{ elasticsearch_port }}/_security/user/kibana_system/_password"
    method: POST
    user: "{{ elastic_admin_user }}"
    password: "{{ elastic_admin_password }}"
    force_basic_auth: yes
    body_format: json
    body:
      password: "{{ elastic_kibana_system_password }}"
    status_code: 200
  register: set_kibana_system_pw
  until: set_kibana_system_pw.status == 200
  retries: 5
  delay: 2

